name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun run build:binaries
      - name: Checksums
        working-directory: dist/bin
        run: sha256sum * > SHA256SUMS
      - run: bun run build:wheels
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/bitqate.js
            dist/bin
            dist/wheels
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/bin/* dist/bitqate.js --title "${GITHUB_REF_NAME}" --generate-notes

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json version
        run: |
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$pkg"; exit 1; }
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: npm publish --provenance --access public
